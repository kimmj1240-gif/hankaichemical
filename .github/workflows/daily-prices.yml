name: Daily resin prices

on:
  schedule:
    # 매일 KST 09:30 (UTC 00:30)에 실행
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "이미 오늘 수집된 행이 있어도 다시 추가"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect today's prices
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: python scripts/collect_prices.py

      - name: Build dashboard
        run: python scripts/build_dashboard.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prices.csv index.html
            git commit -m "chore(prices): daily snapshot $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no changes"
          fi

  deploy-pages:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild dashboard from latest data
        run: python scripts/build_dashboard.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
